# PR Validation — Full cross-architecture build and test
#
# Mirrors the Azure Pipelines CI pipeline (azure-pipelines.yml) but runs as a
# GitHub Actions workflow so PR checks work without Azure DevOps integration.
#
# Pipeline structure:
#   1. Detect whether the PR changes files outside docs/ and apidocs/
#   2. Three parallel scrape jobs (x64, x86, arm64) generate metadata source
#   3. One build job assembles the winmd, packages, samples, and runs tests
#      or reports success immediately for documentation-only PRs

name: PR Validation

on:
  pull_request:
  push:
    branches: [main, feature/header-annotations]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILD_CONFIGURATION: Release

jobs:
  workflow-tests:
    name: Workflow regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Test API diff comment workflow
        run: node --test .github/tests/pr-api-diff-comment.test.cjs

  tooling-tests:
    name: Tooling tests
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Run all tooling tests
        shell: pwsh
        run: .\scripts\TestTooling.ps1
      - name: Retain tooling evidence
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: tooling-tests
          path: |
            bin/tooling-tests
            bin/emission-evidence
          retention-days: 30

  sdk-patch-tests:
    name: SDK patch application tests
    needs: [changes]
    if: needs.changes.outputs.sdk_patches_needed == 'true'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Run SDK patch application tests
        shell: pwsh
        run: |
          . .\scripts\CommonUtils.ps1
          $results = Join-Path $rootDir 'bin\sdk-patch-tests'
          New-Item -ItemType Directory -Force $results | Out-Null
          $trx = Join-Path $results 'sdk-patches.trx'
          if (Test-Path $trx) { Remove-Item $trx }
          dotnet test tests\ClangSharpSourceToWinmdTests -c Release --filter 'FullyQualifiedName~ClangSharpSourceToWinmdTests.SdkPatchTests' --logger 'trx;LogFileName=sdk-patches.trx' --results-directory $results
          if ($LASTEXITCODE -ne 0) { throw "SDK patch tests failed (exit $LASTEXITCODE)." }
          Assert-TestResults $trx
      - name: Retain SDK patch test results
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: sdk-patch-tests
          path: bin/sdk-patch-tests
          retention-days: 30

  qualification:
    name: Full paired migration measurement
    if: github.repository == 'jevansaks/win32metadata'
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - name: Check out frozen reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 86ed37b2846440297afb087c4718acd1a1fb4ad8
          path: .qualification/reference
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Qualify identical legacy inputs
        shell: pwsh
        run: .\scripts\TestMigrationQualification.ps1 -ReferenceDirectory .qualification\reference
      - name: Retain qualification evidence
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: migration-evidence
          path: bin/migration-qualification
          retention-days: 30

  migration:
    name: Migration qualification
    needs: [changes, workflow-tests, tooling-tests, scrape, build-test, qualification, sdk-patch-tests]
    if: always() && github.repository == 'jevansaks/win32metadata'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require every qualification dependency
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: pwsh
        run: |
          $needs = $env:NEEDS | ConvertFrom-Json -AsHashtable
          foreach ($name in 'changes', 'workflow-tests', 'tooling-tests', 'scrape', 'build-test', 'qualification') {
            if ($needs[$name].result -ne 'success') {
              throw "Required dependency $name did not succeed: $($needs[$name].result)"
            }
          }
      - name: Require SDK tests for ingestion changes
        env:
          NEEDS: ${{ toJSON(needs) }}
          SDK_PATCHES_NEEDED: ${{ needs.changes.outputs.sdk_patches_needed }}
        shell: pwsh
        run: |
          $needs = $env:NEEDS | ConvertFrom-Json -AsHashtable
          $result = $needs['sdk-patch-tests'].result
          if ($env:SDK_PATCHES_NEEDED -eq 'true') {
            if ($result -ne 'success') { throw "Required SDK patch tests did not succeed: $result" }
          } elseif ($env:SDK_PATCHES_NEEDED -eq 'false') {
            if ($result -ne 'skipped') { throw "Unexpected SDK patch test state for unrelated changes: $result" }
          } else {
            throw 'Missing or invalid SDK patch change detection.'
          }
      - name: Verify retained qualification receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: migration-evidence
          path: evidence
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Verify receipt and output binding
        shell: pwsh
        run: |
          dotnet build sources\WinmdUtils -c Release --verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw 'Qualification verifier build failed.' }
          dotnet bin\Release\net10.0\WinmdUtils.dll verifyMigrationEvidence --directory evidence
          if ($LASTEXITCODE -ne 0) { throw 'Retained qualification evidence is invalid.' }

  changes:
    name: Detect build changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_needed: ${{ steps.filter.outputs.build_needed }}
      sdk_patches_needed: ${{ steps.filter.outputs.sdk_patches_needed }}

    steps:
      - name: Check changed paths
        id: filter
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('build_needed', 'true');
              core.setOutput('sdk_patches_needed', 'true');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });

            const ignoredPrefixes = ['docs/', 'apidocs/'];
            const changedPaths = files.flatMap(file =>
              file.status === 'renamed' && file.previous_filename
                ? [file.previous_filename, file.filename]
                : [file.filename]);
            const buildFiles = [...new Set(changedPaths)]
              .filter(file => !ignoredPrefixes.some(prefix => file.startsWith(prefix)));
            const fileListIncomplete = files.length < context.payload.pull_request.changed_files;
            const sdkPatchFiles = new Set([
              '.github/workflows/pr-validation.yml',
              'scripts/ApplySDKPatches.ps1', 'scripts/UpdateSDK.ps1',
              'scripts/RecompileIdlFilesForScraping.ps1',
              'scripts/ConvertMidlAttributesToSalAnnotations.ps1',
              'scripts/CommonUtils.ps1', 'scripts/TestTooling.ps1',
              'tests/ClangSharpSourceToWinmdTests/SdkPatchTests.cs',
              'tests/ClangSharpSourceToWinmdTests/ClangSharpSourceToWinmdTests.csproj',
              'generation/WinSDK/RecompiledIdlHeaders/um/amstream.idl',
              'generation/WinSDK/RecompiledIdlHeaders/um/Uxtheme.h',
              'BuildTools/BuildTools.proj', 'Directory.Build.props',
              'Directory.Build.targets', 'global.json', 'nuget.config'
            ]);
            const sdkPatchPrefixes = [
              'generation/WinSDK/patches/',
              'tests/ClangSharpSourceToWinmdTests/SdkPatchFixtures/',
              '.github/actions/upload-artifact-with-retry/'
            ];
            const sdkPatchesNeeded = fileListIncomplete || changedPaths.some(file =>
              sdkPatchFiles.has(file) || sdkPatchPrefixes.some(prefix => file.startsWith(prefix)));
            const buildNeeded = context.repo.owner === 'jevansaks' || fileListIncomplete || buildFiles.length !== 0;

            core.setOutput('build_needed', buildNeeded.toString());
            core.setOutput('sdk_patches_needed', sdkPatchesNeeded.toString());
            await core.summary
              .addHeading(buildNeeded ? 'Full validation required' : 'Documentation-only change')
              .addRaw(fileListIncomplete
                ? 'The complete changed-file list was not available. Running full validation.'
                : buildNeeded
                  ? `Files outside docs/ or apidocs/ changed:\n${buildFiles.map(file => `- ${file}`).join('\n')}`
                  : 'All changed files are under docs/ or apidocs/. The expensive build is skipped.')
              .write();

  # ──────────────────────────────────────────────────────────────────────
  # Stage 1: Parallel header scraping (one job per architecture)
  # ──────────────────────────────────────────────────────────────────────

  scrape:
    name: 'Scrape headers: ${{ matrix.arch }}'
    needs: [changes]
    if: needs.changes.outputs.build_needed == 'true'
    runs-on: windows-2022
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
        include:
          - arch: x64
            extra_args: ''
            set_version: true
          - arch: x86
            extra_args: '-scrapeConstants'
            set_version: false
          - arch: arm64
            extra_args: ''
            set_version: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Install nbgv and set version
        if: matrix.set_version
        shell: pwsh
        run: |
          .\scripts\Install-DotNetTool.ps1 -Name nbgv -NuGetConfigFile "${{ github.workspace }}\nuget.config"
          nbgv cloud

      - name: Generate metadata source (${{ matrix.arch }})
        shell: pwsh
        run: .\scripts\GenerateMetadataSource.ps1 -arch ${{ matrix.arch }} ${{ matrix.extra_args }}

      - name: Upload generated assets
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: generated_${{ matrix.arch }}
          path: generation/WinSDK/obj
          retention-days: 1

      - name: Upload build logs
        uses: ./.github/actions/upload-artifact-with-retry
        if: always()
        with:
          name: scrape_logs_${{ matrix.arch }}
          path: bin/logs
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # Stage 2: Build, test, and package (depends on all scrape jobs)
  # ──────────────────────────────────────────────────────────────────────

  build-test:
    name: 'Build, test, package'
    needs: [changes, scrape, qualification]
    if: always()
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Verify change detection
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'Change detection did not succeed.'

      - name: Verify fork qualification
        if: github.repository == 'jevansaks/win32metadata' && needs.qualification.result != 'success'
        shell: pwsh
        run: throw 'Fork migration qualification did not succeed.'

      - name: Documentation-only change
        if: needs.changes.outputs.build_needed != 'true'
        shell: pwsh
        run: Write-Host 'All changed files are under docs/ or apidocs/. No build is required.'

      - name: Verify scrape jobs
        if: needs.changes.outputs.build_needed == 'true' && needs.scrape.result != 'success'
        shell: pwsh
        run: throw 'One or more header scrape jobs did not succeed.'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.build_needed == 'true'
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        if: needs.changes.outputs.build_needed == 'true'
        with:
          global-json-file: global.json

      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0
        if: needs.changes.outputs.build_needed == 'true'

      - name: Download x64 generated assets
        if: needs.changes.outputs.build_needed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated_x64
          path: generation/WinSDK/obj

      - name: Download x86 generated assets
        if: needs.changes.outputs.build_needed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated_x86
          path: generation/WinSDK/obj

      - name: Download arm64 generated assets
        if: needs.changes.outputs.build_needed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated_arm64
          path: generation/WinSDK/obj

      - name: Build metadata binary
        if: needs.changes.outputs.build_needed == 'true'
        shell: pwsh
        run: .\scripts\BuildMetadataBin.ps1 -assetsScrapedSeparately

      - name: Package
        if: needs.changes.outputs.build_needed == 'true'
        shell: pwsh
        run: .\scripts\DoPackages.ps1

      - name: Build samples
        if: needs.changes.outputs.build_needed == 'true'
        shell: pwsh
        run: .\scripts\DoSamples.ps1

      - name: Run tests
        if: needs.changes.outputs.build_needed == 'true'
        shell: pwsh
        run: .\scripts\DoTests.ps1

      - name: Download baseline winmd from target branch
        if: needs.changes.outputs.build_needed == 'true' && github.event_name == 'pull_request' && github.repository != 'jevansaks/win32metadata'
        id: baseline
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Find the latest successful run on the target branch
            const baseBranch = context.payload.pull_request.base.ref;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-validation.yml',
              branch: baseBranch,
              status: 'success',
              per_page: 1
            });

            if (runs.data.workflow_runs.length === 0) {
              core.warning(`No successful runs found on ${baseBranch}. Will fall back to NuGet baseline.`);
              return;
            }

            const runId = runs.data.workflow_runs[0].id;
            core.info(`Found baseline run ${runId} on ${baseBranch}`);

            // Find the winmd artifact
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });

            const winmdArtifact = artifacts.data.artifacts.find(a => a.name === 'winmd');
            if (!winmdArtifact) {
              core.warning('No winmd artifact found in baseline run. Will fall back to NuGet baseline.');
              return;
            }

            if (winmdArtifact.expired) {
              core.warning('The baseline winmd artifact has expired. Will fall back to NuGet baseline.');
              return;
            }

            // Download and extract
            try {
              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: winmdArtifact.id,
                archive_format: 'zip'
              });

              const outputDir = 'bin/baseline-artifact';
              fs.mkdirSync(outputDir, { recursive: true });
              const zipPath = path.join(outputDir, 'artifact.zip');
              fs.writeFileSync(zipPath, Buffer.from(download.data));

              // Extract using PowerShell
              const { execSync } = require('child_process');
              execSync(`Expand-Archive -Path "${zipPath}" -DestinationPath "${outputDir}" -Force`, { shell: 'pwsh' });
              fs.unlinkSync(zipPath);
              core.info(`Extracted baseline winmd to ${outputDir}`);
            } catch (error) {
              core.warning(`Could not download or extract the baseline winmd artifact. Will fall back to NuGet baseline: ${error.message}`);
            }

      - name: Download frozen fork reference
        if: github.repository == 'jevansaks/win32metadata' && github.event_name == 'pull_request'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: migration-evidence
          path: bin/baseline-artifact

      - name: Select frozen fork reference
        if: github.repository == 'jevansaks/win32metadata' && github.event_name == 'pull_request'
        shell: pwsh
        run: |
          dotnet bin\Release\net10.0\WinmdUtils.dll verifyMigrationEvidence --directory bin\baseline-artifact
          if ($LASTEXITCODE -ne 0) { throw 'Frozen reference evidence is invalid.' }
          Copy-Item bin\baseline-artifact\pair-1-reference.winmd bin\baseline-artifact\Windows.Win32.winmd

      - name: Generate API surface diff
        if: needs.changes.outputs.build_needed == 'true' && github.event_name == 'pull_request'
        id: apidump
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $winmdUtils = "bin\Release\net10.0\WinmdUtils.dll"
          $currentWinmd = "bin\Windows.Win32.winmd"

          # Determine baseline: prefer main branch artifact, fall back to last release
          $baselineWinmd = "bin\baseline-artifact\Windows.Win32.winmd"
          if (-not (Test-Path $baselineWinmd)) {
            Write-Host "No main branch artifact found, falling back to last NuGet release..."
            . .\scripts\CommonUtils.ps1
            $baselineWinmd = Get-Win32MetadataLastReleaseWinmdPath
          }

          Write-Host "Baseline: $baselineWinmd"
          Write-Host "Current:  $currentWinmd"

          # Dump baseline
          Write-Host "Dumping baseline..."
          & dotnet $winmdUtils dump --winmd $baselineWinmd --output bin\baseline.apidump.cs
          if ($LASTEXITCODE -ne 0) { throw "Failed to dump baseline" }

          # Dump current build
          Write-Host "Dumping current build..."
          & dotnet $winmdUtils dump --winmd $currentWinmd --output bin\current.apidump.cs
          if ($LASTEXITCODE -ne 0) { throw "Failed to dump current" }

          # Generate diff — git diff exits 1 when differences exist, which is expected
          & cmd /c "git diff --no-index --unified=3 bin\baseline.apidump.cs bin\current.apidump.cs > bin\api-diff.patch 2>&1"
          $diffExitCode = $LASTEXITCODE

          if ($diffExitCode -eq 0) {
            Write-Host "No API differences found."
            "has_diff=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "API differences detected."
            "has_diff=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

            # Count additions/deletions from the patch file
            $diffLines = Get-Content bin\api-diff.patch
            $additions = ($diffLines | Where-Object { $_ -match '^\+[^+]' }).Count
            $deletions = ($diffLines | Where-Object { $_ -match '^\-[^-]' }).Count
            "additions=$additions" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "deletions=$deletions" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

            Write-Host "+$additions additions / -$deletions deletions"
          }

          # Reset LASTEXITCODE so GitHub Actions doesn't treat this step as failed
          $global:LASTEXITCODE = 0

      - name: Upload API diff
        if: needs.changes.outputs.build_needed == 'true' && github.event_name == 'pull_request'
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: api-diff
          path: bin/api-diff.patch
          retention-days: 7

      - name: Upload winmd and API dump
        uses: ./.github/actions/upload-artifact-with-retry
        if: always() && needs.changes.outputs.build_needed == 'true'
        with:
          name: winmd
          path: |
            bin/Windows.Win32.winmd
            bin/current.apidump.cs
            bin/baseline.apidump.cs
            bin/api-diff.patch
          retention-days: 90

      - name: Upload build logs
        uses: ./.github/actions/upload-artifact-with-retry
        if: always() && needs.changes.outputs.build_needed == 'true'
        with:
          name: build_logs
          path: bin/logs
          retention-days: 7

      - name: Retain full test results
        if: always() && needs.changes.outputs.build_needed == 'true'
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: full-test-results
          path: |
            bin/tooling-tests
            bin/winmd-tests
          retention-days: 30

      - name: Upload NuGet packages
        if: needs.changes.outputs.build_needed == 'true'
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: NuGetPackages
          path: bin/Packages/Release/NuGet
          retention-days: 7
